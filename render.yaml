databases:
  - name: wivme-db
    plan: free
    databaseName: wivme
    user: wivme

services:
  - type: web
    name: wivme-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build && npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wivme-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: FOUNDER_NOTIFY_EMAILS
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: wivme-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
